name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Typecheck, Unit, Build, E2E, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + station parity tests
        run: npm run test:unit

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build (GitHub Pages static export)
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E, accessibility and responsive tests (5 viewports)
        run: npm run test:e2e

      - name: Build (Cloudflare /dart static export for www.elliyeen.com/dart)
        env:
          EXPORT_TARGET: cloudflare-dart
        run: npm run build

      - name: Route manifest + link/asset crawl under /dart (fails on any non-200)
        run: |
          SITE_BASE=/dart PORT=4173 node scripts/serve-out.mjs &
          sleep 2
          node scripts/route-manifest.mjs http://localhost:4173 /dart docs/route-manifest-cloudflare-dart

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
